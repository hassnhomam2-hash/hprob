name: Build APK
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: "3.11"
          buildozer-cmd: buildozer android debug
          work-dir: .
          pre-installed-packages: " "
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hprob-APK
          path: bin/*.apk
